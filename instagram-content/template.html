<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Amiri"; src: url(fonts/Amiri-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "Amiri Quran"; src: url(fonts/AmiriQuran-Regular.ttf); }
  @font-face { font-family: "Readex"; src: url(fonts/ReadexPro-Light.ttf); font-weight: 300; }
  @font-face { font-family: "Readex"; src: url(fonts/ReadexPro-Medium.ttf); font-weight: 500; }
  @font-face { font-family: "Readex"; src: url(fonts/ReadexPro-Bold.ttf); font-weight: 700; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; }
  #card { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--base); color: var(--ink); }
  .layer { position: absolute; inset: 0; }

  /* palettes */
  .fajr    { --base:#101a46; --b1:#ff9e8a; --b2:#4c62d8; --b3:#ffc978; --ink:#fffaf2; --acc:#ffd08a; --soft:rgba(255,250,242,.74); --g1:rgba(255,255,255,.26); --g2:rgba(255,255,255,.07); --line:rgba(255,208,138,.55); --chip:rgba(255,255,255,.14); --shadow:rgba(5,8,30,.55); }
  .dhuhr   { --base:#dfeee2; --b1:#7fc4a0; --b2:#f2d9a0; --b3:#9fd0e0; --ink:#10261c; --acc:#1f6b4a; --soft:rgba(16,38,28,.66); --g1:rgba(255,255,255,.62); --g2:rgba(255,255,255,.30); --line:rgba(31,107,74,.40); --chip:rgba(255,255,255,.45); --shadow:rgba(20,60,40,.28); }
  .asr     { --base:#f6d9b8; --b1:#ff9a5c; --b2:#ffd9a0; --b3:#d9705a; --ink:#2c160a; --acc:#9a3f1c; --soft:rgba(44,22,10,.66); --g1:rgba(255,255,255,.58); --g2:rgba(255,246,236,.26); --line:rgba(154,63,28,.40); --chip:rgba(255,255,255,.42); --shadow:rgba(110,50,20,.30); }
  .maghrib { --base:#24133e; --b1:#ff8a5c; --b2:#9b3f9a; --b3:#ffbf6b; --ink:#fff4ea; --acc:#ffc98e; --soft:rgba(255,244,234,.76); --g1:rgba(255,255,255,.24); --g2:rgba(255,255,255,.06); --line:rgba(255,201,142,.55); --chip:rgba(255,255,255,.14); --shadow:rgba(20,5,30,.55); }
  .isha    { --base:#060b1c; --b1:#1b6b6b; --b2:#2c3a8c; --b3:#147a5c; --ink:#f5eedd; --acc:#e2c07a; --soft:rgba(245,238,221,.70); --g1:rgba(255,255,255,.20); --g2:rgba(255,255,255,.04); --line:rgba(226,192,122,.5); --chip:rgba(255,255,255,.10); --shadow:rgba(0,0,0,.6); }

  .blob { position: absolute; border-radius: 50%; opacity: .9; }
  #grain { opacity: .07; width: 100%; height: 100%; }
  .dhuhr #grain, .asr #grain { opacity: .09; }

  #arch, #archShadow { position: absolute; left: 0; top: 0; }
  #geo { opacity: .13; }
  .dhuhr #geo, .asr #geo { opacity: .11; }
  .dhuhr #text, .asr #text { text-shadow: 0 1px 0 rgba(255,255,255,.55); }
  /* frosted "liquid glass" panel */
  #archGlass { position: absolute; background: linear-gradient(160deg, var(--g1) 0%, var(--g2) 45%, var(--g2) 100%);
               backdrop-filter: blur(38px) saturate(175%); -webkit-backdrop-filter: blur(38px) saturate(175%); }
  #archGlass::before { content: ""; position: absolute; inset: 0;
               background: radial-gradient(90% 38% at 28% 0%, rgba(255,255,255,.42), rgba(255,255,255,0) 70%),
                           radial-gradient(60% 30% at 85% 100%, rgba(255,255,255,.16), rgba(255,255,255,0) 70%); }
  .glass-chip { background: var(--chip); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
               border: 1.5px solid rgba(255,255,255,.55); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), 0 8px 24px var(--shadow); }

  #content { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { font-family: "Readex"; font-weight: 500; font-size: 26px; color: var(--ink); letter-spacing: .5px;
          padding: 10px 28px 12px; border-radius: 99px; display: inline-flex; gap: 12px; align-items: center; }
  .pill b { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); display: inline-block; }
  .label { font-family: "Readex"; font-weight: 700; font-size: 58px; color: var(--acc); margin-top: 34px; line-height: 1.3; }
  .sub { font-family: "Readex"; font-weight: 300; font-size: 26px; color: var(--soft); margin-top: 10px; }
  .rule { width: 64px; height: 3px; border-radius: 3px; background: var(--acc); margin: 30px 0 44px; }
  #text { font-family: "Amiri"; font-weight: 700; line-height: 1.85; color: var(--ink); text-wrap: balance; text-shadow: 0 2px 14px var(--shadow); }
  #text.quran { font-family: "Amiri Quran"; font-weight: 400; line-height: 2.05; }
  #text .w { display: inline-block; white-space: pre; }
  .orn { color: var(--acc); }
  .note { margin-top: 34px; font-family: "Readex"; font-weight: 500; font-size: 26px; color: var(--base);
          background: var(--acc); border-radius: 99px; padding: 8px 26px 10px; }
  .source { margin-top: 30px; font-family: "Readex"; font-weight: 300; font-size: 27px; color: var(--soft); }

  .foot, .head { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
          font-family: "Readex"; color: var(--soft); font-size: 24px; font-weight: 300; }
  .foot .handle { font-weight: 500; color: var(--ink); direction: ltr; letter-spacing: .5px; padding: 8px 22px 10px; border-radius: 99px; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 22px; height: 4px; border-radius: 4px; background: var(--line); opacity: .5; }
  .dots i.on { background: var(--acc); opacity: 1; width: 40px; }

  .spark { position: absolute; border-radius: 50%; background: var(--acc); }
</style>
</head>
<body>
<div id="card">
  <div id="blobs" class="layer"></div>
  <div id="sparks" class="layer"></div>
  <svg id="grain" class="layer"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <svg id="geo" class="layer" style="width:100%;height:100%"><defs><pattern id="star8" width="150" height="150" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="var(--acc)" stroke-width="1.6" transform="translate(75 75)"><rect x="-36" y="-36" width="72" height="72"/><rect x="-36" y="-36" width="72" height="72" transform="rotate(45)"/><circle r="16"/><path d="M-75 0H-51M51 0H75M0 -75V-51M0 51V75"/></g>
  </pattern></defs><rect width="100%" height="100%" fill="url(#star8)"/></svg>
  <svg id="archShadow"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="34"/></filter></defs><path id="archShadowPath" fill="var(--shadow)" filter="url(#sh)"/></svg>
  <div id="archGlass"></div>
  <svg id="arch"><defs><linearGradient id="edge" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient></defs>
    <path id="archPath" fill="none" stroke="url(#edge)" stroke-width="2.5"/><path id="archPath2" fill="none" stroke="var(--line)" stroke-width="1.2" opacity=".7"/></svg>

  <svg id="crown" viewBox="-50 -50 100 100" style="position:absolute;width:64px;height:64px"><g fill="none" stroke="var(--acc)" stroke-width="3"><rect x="-26" y="-26" width="52" height="52"/><rect x="-26" y="-26" width="52" height="52" transform="rotate(45)"/><circle r="9" fill="var(--acc)" stroke="none"/></g></svg>
  <div class="head" id="head"><span id="day"></span><span class="dots" id="dots"></span></div>
  <div id="content">
    <div class="pill glass-chip" id="pill"></div>
    <div class="label" id="label"></div>
    <div class="sub" id="sub" style="display:none"></div>
    <div class="rule" id="rule"></div>
    <div id="text"></div>
    <div class="note" id="note" style="display:none"></div>
    <div class="source" id="source"></div>
  </div>
  <div class="foot" id="foot"><span class="handle glass-chip">@baqiiyaat</span><span>الباقيات الصالحات</span></div>
</div>

<script>
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const win = (t,a,b)=>ease((t-a)/(b-a));
function rnd(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const ORDER = ['fajr','dhuhr','asr','maghrib','isha'];
let P, W, H, words = [], sparks = [], blobs = [], archLen = 0;

// mihrab arch: straight sides, pointed top
function archD(x, y, w, h) {
  const r = w / 2, sh = y + r * 1.05;
  return `M${x} ${y+h} V${sh} C${x} ${sh - r*0.62} ${x + r*0.55} ${y + r*0.18} ${x + r} ${y} ` +
         `C${x + r*1.45} ${y + r*0.18} ${x + w} ${sh - r*0.62} ${x + w} ${sh} V${y+h} Z`;
}

window.setup = async (post, day, vertical) => {
  P = post; W = 1080; H = vertical ? 1920 : 1350;
  const card = document.getElementById('card');
  card.className = post.theme;
  card.style.setProperty('--w', W + 'px'); card.style.setProperty('--h', H + 'px');

  const aw = 840, ax = (W - aw) / 2;
  const ay = vertical ? 270 : 140, ah = vertical ? 1290 : 1090;
  const svg = document.getElementById('arch');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  document.getElementById('archPath').setAttribute('d', archD(ax, ay, aw, ah));
  document.getElementById('archPath2').setAttribute('d', archD(ax + 18, ay + 24, aw - 36, ah - 42));
  archLen = document.getElementById('archPath').getTotalLength();
  const sv = document.getElementById('archShadow'); sv.setAttribute('width', W); sv.setAttribute('height', H);
  document.getElementById('archShadowPath').setAttribute('d', archD(ax + 30, ay + 46, aw - 60, ah - 20));
  Object.assign(document.getElementById('archGlass').style, { left: ax + 'px', top: ay + 'px', width: aw + 'px', height: ah + 'px',
    clipPath: `path('${archD(0, 0, aw, ah)}')` });

  Object.assign(document.getElementById('crown').style, { left: (W/2 - 32) + 'px', top: (ay + aw*0.17) + 'px' });
  const c = document.getElementById('content');
  const ct = ay + aw * 0.30;
  Object.assign(c.style, { left: (ax + 60) + 'px', top: ct + 'px', width: (aw - 120) + 'px', height: (ay + ah - ct - 40) + 'px' });
  Object.assign(document.getElementById('head').style, { top: (vertical ? 170 : 58) + 'px', padding: '0 120px' });
  Object.assign(document.getElementById('foot').style, { bottom: (vertical ? 300 : 52) + 'px', padding: '0 120px' });

  document.getElementById('day').textContent = day;
  document.getElementById('dots').innerHTML = ORDER.map(o => `<i class="${o===post.theme?'on':''}"></i>`).join('');
  document.getElementById('pill').innerHTML = `<b></b>${post.pill || 'بعد صلاة ' + post.prayer}`;
  document.getElementById('dots').style.visibility = (!post.pill || post.pill.startsWith('بعد صلاة')) ? '' : 'hidden';
  document.getElementById('label').textContent = post.label;
  const note = document.getElementById('note');
  note.style.display = post.note ? '' : 'none'; note.textContent = post.note || '';
  document.getElementById('source').textContent = post.source;

  const tx = document.getElementById('text');
  tx.className = post.font === 'quran' ? 'quran' : '';
  const [o, cl] = post.font === 'quran' ? ['﴿', '﴾'] : ['«', '»'];
  const ws = post.text.split(' ').reduce((a, w) => (/^[\u06D6-\u06DC]$/.test(w) && a.length ? (a[a.length-1] += ' ' + w) : a.push(w), a), []);
  tx.innerHTML = ws.map((w, i) => `<span class="w">${i===0?`<span class="orn">${o}</span>`:''}${w}${i===ws.length-1?`<span class="orn">${cl}</span>`:''}</span>`).join(' ');
  words = [...tx.querySelectorAll('.w')];

  const r = rnd(ORDER.indexOf(post.theme) * 97 + 7);
  const bl = document.getElementById('blobs'); bl.innerHTML = ''; blobs = [];
  ['--b1','--b2','--b3','--b1'].forEach((v, i) => {
    const b = document.createElement('div'); b.className = 'blob';
    const s = 900 + r() * 500;
    Object.assign(b.style, { width: s+'px', height: s+'px', background: `radial-gradient(circle, var(${v}) 0%, transparent 68%)` });
    bl.appendChild(b);
    blobs.push({ el: b, x: r()*W - s/2, y: (i/3)*H - s/2 + r()*200, s, ph: r()*6.28, sp: .15 + r()*.2 });
  });
  const sp = document.getElementById('sparks'); sp.innerHTML = ''; sparks = [];
  const dark = ['fajr','maghrib','isha'].includes(post.theme);
  for (let i = 0; i < (dark ? 46 : 26); i++) {
    const e = document.createElement('div'); e.className = 'spark';
    const s = 2 + r() * 4; Object.assign(e.style, { width: s+'px', height: s+'px' });
    sp.appendChild(e); sparks.push({ el: e, x: r()*W, y: r()*H, v: 12 + r()*30, ph: r()*6.28 });
  }

  await document.fonts.ready;
  let fs = vertical ? 80 : 74; tx.style.fontSize = fs + 'px';
  const fits = () => [...c.children].reduce((h, e) => h + (e.offsetParent ? e.offsetHeight : 0), 0) + 150 < c.clientHeight;
  while (fs > 36 && !fits()) { fs -= 2; tx.style.fontSize = fs + 'px'; }
};

window.setT = (t, T) => {
  const still = t >= T;
  blobs.forEach(b => {
    const dx = Math.sin(t*b.sp + b.ph) * 90, dy = Math.cos(t*b.sp*0.8 + b.ph) * 70;
    b.el.style.transform = `translate(${b.x + dx}px, ${b.y + dy}px)`;
  });
  sparks.forEach(s => {
    const y = ((s.y - t * s.v) % H + H) % H;
    s.el.style.transform = `translate(${s.x + Math.sin(t*.6 + s.ph)*14}px, ${y}px)`;
    s.el.style.opacity = (.25 + .35 * (0.5 + 0.5*Math.sin(t*1.7 + s.ph))) * (still ? 1 : win(t, 0, 1.5));
  });

  const a = still ? 1 : win(t, 0.1, 2.4);
  ['archPath','archPath2'].forEach(id => { const p = document.getElementById(id);
    p.style.strokeDasharray = archLen; p.style.strokeDashoffset = archLen * (1 - a); });
  document.getElementById('archGlass').style.opacity = still ? 1 : win(t, 0.8, 2.6);
  document.getElementById('archShadow').style.opacity = still ? 1 : win(t, 0.8, 2.6);

  const fade = (id, a0, a1) => { const k = still ? 1 : win(t, a0, a1); const e = document.getElementById(id);
    e.style.opacity = k; e.style.transform = `translateY(${(1-k)*18}px)`; };
  fade('head', 0.3, 1.2); fade('crown', 1.6, 2.6); fade('foot', 0.3, 1.2);
  fade('pill', 1.0, 1.8); fade('label', 1.3, 2.2);
  document.getElementById('rule').style.width = (still ? 64 : 64 * win(t, 1.8, 2.6)) + 'px';
  const w0 = 2.4, per = Math.min(0.32, 4.2 / Math.max(words.length, 1));
  words.forEach((w, i) => { const k = still ? 1 : win(t, w0 + i*per, w0 + i*per + 0.7);
    w.style.opacity = k; w.style.transform = `translateY(${(1-k)*14}px)`; w.style.filter = k < 1 ? `blur(${(1-k)*5}px)` : ''; });
  const end = w0 + words.length*per + 0.4;
  fade('note', end, end + 0.8); fade('source', end + 0.3, end + 1.1);
};

// ---- segment mode (reels with several screens: basmala / ayah chunks / dhikr) ----
let SEG = null, curSeg = -1;
function fillSeg(sg) {
  document.getElementById('label').textContent = sg.label;
  const sub = document.getElementById('sub'); sub.style.display = sg.sub ? '' : 'none'; sub.textContent = sg.sub || '';
  const note = document.getElementById('note'); note.style.display = sg.note ? '' : 'none'; note.textContent = sg.note || '';
  document.getElementById('source').textContent = sg.source || '';
  const tx = document.getElementById('text');
  tx.className = sg.quran ? 'quran' : '';
  const [o, cl] = sg.quran ? ['﴿', '﴾'] : ['«', '»'];
  const ws = sg.text.split(' ').reduce((a, w) => (/^[ۖ-ۜ]$/.test(w) && a.length ? (a[a.length-1] += ' ' + w) : a.push(w), a), []);
  const open = sg.open !== false, close = sg.close !== false;
  tx.innerHTML = ws.map((w, i) => `<span class="w">${i===0&&open?`<span class="orn">${o}</span>`:''}${w}${i===ws.length-1&&close?`<span class="orn">${cl}</span>`:''}</span>`).join(' ');
  words = [...tx.querySelectorAll('.w')];
  if (sg.fs) tx.style.fontSize = sg.fs + 'px';
}
window.setupSegments = async (post, day, segs) => {
  await window.setup(Object.assign({}, post, { text: segs[0].text, label: segs[0].label, source: segs[0].source }), day, true);
  SEG = segs; curSeg = -1;
  const c = document.getElementById('content'), tx = document.getElementById('text');
  const fits = () => [...c.children].reduce((h, e) => h + (e.offsetParent ? e.offsetHeight : 0), 0) + 150 < c.clientHeight;
  for (const sg of SEG) { sg.fs = null; fillSeg(sg); let fs = sg.quran ? 76 : 70; tx.style.fontSize = fs + 'px';
    while (fs > 34 && !fits()) { fs -= 2; tx.style.fontSize = fs + 'px'; } sg.fs = fs; }
};
window.setSegT = (t) => {
  window.setT(t + 2.6, 1e9);  // frame already drawn at t=0 so the ayah is the hook
  let i = SEG.findIndex(sg => t >= sg.start && t < sg.end); if (i < 0) i = t < SEG[0].start ? 0 : SEG.length - 1;
  if (i !== curSeg) { fillSeg(SEG[i]); curSeg = i; }
  const sg = SEG[i], first = i === 0;
  const fadeOut = i < SEG.length - 1 ? clamp((sg.end - t) / 0.35) : 1;
  const show = (id, a0, a1) => { const k = win(t, a0, a1) * fadeOut; const e = document.getElementById(id);
    e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 14}px)`; };
  const s0 = sg.start + 0.05;
  show('label', s0, s0 + 0.6); show('sub', s0 + 0.2, s0 + 0.8);
  const span = Math.min((sg.end - sg.start) * 0.55, Math.max(1.2, words.length * 0.28));
  const per = span / Math.max(words.length, 1), w0 = s0 + 0.3;
  words.forEach((w, j) => { const k = win(t, w0 + j * per, w0 + j * per + 0.6) * fadeOut;
    w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 12}px)`; w.style.filter = k < 1 ? `blur(${(1 - k) * 4}px)` : ''; });
  show('note', w0 + span, w0 + span + 0.6); show('source', w0 + span + 0.2, w0 + span + 0.8);
};
</script>
</body>
</html>
