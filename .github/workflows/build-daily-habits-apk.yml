name: Build Daily Habits APK

on:
  push:
    paths:
      - 'daily-habits-app/**'
      - '.github/workflows/build-daily-habits-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-habits-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DailyHabitsGlass.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DailyHabitsGlass-apk
          path: daily-habits-app/out/DailyHabitsGlass.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-habits-v1.0.${{ github.run_number }}
          name: عاداتي الزجاجية v1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            تطبيق مساعد يومي للعادات الصحية بتصميم زجاجي + ويدجت زجاجية.
            حمّل ملف DailyHabitsGlass.apk وثبّته على هاتفك (Android 8.0 أو أحدث).
          files: daily-habits-app/out/DailyHabitsGlass.apk
