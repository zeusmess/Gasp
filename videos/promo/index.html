<!doctype html>
<html
  lang="ar"
  data-resolution="landscape"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #d6d3ce;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="light" data-composition-id="light" data-composition-src="compositions/light.html"
        data-start="0" data-duration="6.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="name" data-composition-id="name" data-composition-src="compositions/name.html"
        data-start="6.4" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="work" data-composition-id="work" data-composition-src="compositions/work.html"
        data-start="10" data-duration="5.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="after" data-composition-id="after" data-composition-src="compositions/after.html"
        data-start="15.6" data-duration="8.8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="eye" data-composition-id="eye" data-composition-src="compositions/eye.html"
        data-start="24.4" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="28.6" data-duration="4.9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <audio id="sfx-impact-name" class="clip" src="assets/sfx/impact-bass-1.mp3"
        data-start="6.95" data-track-index="3" data-volume="0.8"></audio>
      <audio id="sfx-whoosh-work" class="clip" src="assets/sfx/whoosh-cinematic.mp3"
        data-start="9.8" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-after" class="clip" src="assets/sfx/whoosh-short.mp3"
        data-start="15.5" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-riser-end" class="clip" src="assets/sfx/riser.mp3"
        data-start="27.2" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-impact-end" class="clip" src="assets/sfx/impact-bass-2.mp3"
        data-start="29.4" data-track-index="7" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
