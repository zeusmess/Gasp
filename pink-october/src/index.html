<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starbucks Pink October</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --blush: #ffd6e5;
    --pink: #ff5fa2;
    --hot: #ec2f7d;
    --berry: #b0124f;
    --plum: #2a0a1c;
    --green: #00704a;
  }
  html, body { margin: 0; padding: 0; background: #12040c; overflow: hidden; }
  #wrap { position: relative; width: 1080px; height: 1920px; transform-origin: 0 0; }
  canvas#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #stage { position: absolute; inset: 0; pointer-events: none; }
  .t { position: absolute; left: 0; width: 1080px; text-align: center; color: #fff; white-space: nowrap; }
  .t div { will-change: transform, opacity, filter; }
  .cap { font: 500 34px/1 'Montserrat'; letter-spacing: .42em; text-transform: uppercase; color: var(--blush); padding-left: .42em; }
  .serif { font: italic 500 82px/1.1 'Playfair Display'; color: #fff; }
  .bold { font: 800 64px/1 'Montserrat'; letter-spacing: .14em; text-transform: uppercase; padding-left: .14em; }
  .huge { font: 900 300px/0.9 'Montserrat'; letter-spacing: .02em; text-transform: uppercase; }
  .big { font: 900 150px/0.95 'Montserrat'; letter-spacing: .04em; text-transform: uppercase; }
  .num { font: 700 30px/1 'Montserrat'; letter-spacing: .5em; color: var(--blush); padding-left: .5em; }
  .script { font: 400 230px/1 'Great Vibes'; color: #fff; }
  .ar { font: 800 84px/1.3 'Cairo'; color: #fff; direction: rtl; }
  .small { font: 500 32px/1.4 'Montserrat'; letter-spacing: .16em; text-transform: uppercase; color: var(--blush); padding-left: .16em; }
  .grad .leaf, .grad.solo {
    background: linear-gradient(180deg, #ffe3ee 0%, #ff8fbf 45%, #ff3f8e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .glow { filter: drop-shadow(0 0 26px rgba(255, 70, 150, .55)) drop-shadow(0 6px 14px rgba(40, 0, 20, .45)); }
  .shadow { filter: drop-shadow(0 6px 18px rgba(40, 0, 20, .55)); }
  .left { text-align: left; left: 96px; width: 900px; }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #fff 0%, #ffd6e5 40%, #ff5fa2 100%); opacity: 0; }
  #fade { position: absolute; inset: 0; background: #12040c; opacity: 0; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(18,2,10,.55) 100%); }
  #grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="stage"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="/dist/gsap.min.js"></script>
<script src="/dist/SplitText.min.js"></script>
<script src="/dist/CustomEase.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "/pink-october/node_modules/three/build/three.module.js",
  "three/addons/": "/pink-october/node_modules/three/examples/jsm/"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
